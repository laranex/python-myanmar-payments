name: Bug Report
description: Report something that is not working as expected.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please complete the fields below so we can reproduce the issue quickly.

  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: Provide the package version that you are using (see `pip show python-myanmar-payments`).
      placeholder: v4.0.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Provide the Python version that you are using (`python --version`).
      placeholder: 3.13.1
    validations:
      required: true

  - type: dropdown
    id: gateway
    attributes:
      label: Gateway
      description: Which gateway is affected?
      options:
        - KBZ Pay
        - Wave Money
        - AYA Payment Gateway
        - Yoma MMQR
        - CyberSource
        - Shared (Amount, callbacks, results)
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating System
      description: If relevant, provide the operating system and version where this occurs.
      placeholder: macOS 15.0, Ubuntu 24.04, Windows 11
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear description of the issue you are facing.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Provide detailed steps to reproduce the issue. A minimal reproduction repository is helpful when possible. Never include live gateway credentials.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any other context that might help diagnose the issue.
    validations:
      required: false
