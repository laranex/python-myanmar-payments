[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-myanmar-payments"
dynamic = ["version"]
description = "Django integration for python-myanmar-payments: settings, sync and async gateways, verified callbacks and gateway acknowledgements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Soe Thura", email = "thixpin@gmail.com" }]
keywords = [
    "laranex",
    "python-myanmar-payments",
    "django",
    "myanmar",
    "payments",
    "payment-gateway",
    "webhooks",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# 4.0.0a16 is the first published core with every API the adapter uses (AsyncWavePay).
# Django 5.2 is the oldest release with security support (4.2 ended in April 2026).
dependencies = [
    "django>=5.2",
    "python-myanmar-payments>=4.0.0a16,<5",
]

[project.urls]
Homepage = "https://github.com/laranex/python-myanmar-payments/tree/dev/adapters/django"
Documentation = "https://github.com/laranex/python-myanmar-payments/tree/dev/adapters/django#readme"
Repository = "https://github.com/laranex/python-myanmar-payments"
Issues = "https://github.com/laranex/python-myanmar-payments/issues"
Changelog = "https://github.com/laranex/python-myanmar-payments/blob/dev/adapters/django/CHANGELOG.md"

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/django_myanmar_payments/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/CHANGELOG.md",
    "/LICENSE.md",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_myanmar_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["django_myanmar_payments"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PIE", "RET", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
