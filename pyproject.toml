[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-myanmar-payments"
dynamic = ["version"]
description = "Python SDK for Myanmar payment gateways: KBZ Pay, Wave Money, AYA Pay, Yoma MMQR and CyberSource. Typed requests and results, exact amounts, sync and async clients."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Nay Thu Khant", email = "naythukhant644@gmail.com" }]
keywords = [
    "laranex",
    "python-myanmar-payments",
    "myanmar",
    "payments",
    "payment-gateway",
    "kbzpay",
    "wave-money",
    "wavepay",
    "aya-pay",
    "yoma",
    "mmqr",
    "cybersource",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://laranex.vercel.app/python-myanmar-payments"
Documentation = "https://laranex.vercel.app/python-myanmar-payments"
Repository = "https://github.com/laranex/python-myanmar-payments"
Issues = "https://github.com/laranex/python-myanmar-payments/issues"
Changelog = "https://github.com/laranex/python-myanmar-payments/blob/dev/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/python_myanmar_payments/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/skills",
    "/CHANGELOG.md",
    "/LICENSE.md",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_myanmar_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["python_myanmar_payments"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PIE", "RET", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
